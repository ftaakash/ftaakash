name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'   # daily, 05:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate game.gif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet gh-space-shooter
          if ! gh-space-shooter "${{ github.repository_owner }}" --output game.gif --strategy random > gen.log 2>&1; then
            tail -n 15 gen.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add game.gif
          git commit -m "chore: update space shooter game" || exit 0
          git push
