name: Update Streak Card

on:
  schedule:
    - cron: '17 * * * *'   # hourly (GitHub may skip some under load)
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/streak.py
      - .github/workflows/streak.yml

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build streak card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/streak.py

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git diff --quiet assets/streak.svg && exit 0
          # new URL each update so browsers and GitHub's image cache fetch the fresh card
          sed -i -E "s#\./assets/streak\.svg(\?v=[0-9]+)?#./assets/streak.svg?v=$(date +%s)#" README.md
          git add assets/streak.svg README.md
          git commit -m "chore: update streak card"
          git pull --rebase -q
          git push
